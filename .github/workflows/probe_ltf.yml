name: probe-ltf

on:
  workflow_dispatch:
  push:
    paths:
      - 'lux_ltf/probe_arsip.py'
      - '.github/workflows/probe_ltf.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Catat lingkungan
        run: |
          python -V
          echo "Commit: ${GITHUB_SHA}"

      - name: Jalankan probe
        id: probe
        run: |
          set +e
          python -m lux_ltf.probe_arsip
          kode=$?
          echo "kode=$kode" >> "$GITHUB_OUTPUT"
          echo "Kode probe: $kode"
          exit 0

      - name: Komit laporan
        run: |
          git config user.name "lux-bot"
          git config user.email "lux-bot@users.noreply.github.com"
          git add reports/probe_ltf.json reports/probe_ltf.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan laporan."
            exit 0
          fi
          git commit -m "laporan probe arsip LTF [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Tegakkan hasil
        run: |
          if [ "${{ steps.probe.outputs.kode }}" != "0" ]; then
            echo "Probe mengembalikan kode ${{ steps.probe.outputs.kode }}"
            exit 1
          fi
          echo "Probe selesai bersih."
