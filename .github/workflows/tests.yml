name: tests

on:
  push:
    paths:
      - 'lux_ltf/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Opsi cache pip pada setup-python (blok `with` di bawah) menuntut adanya
      # berkas dependensi di akar repo: requirements.txt atau pyproject.toml.
      # Bila tidak ada, langkah ini GAGAL keras. Itulah cacat 24, yang membuat
      # keempat run pertama repo ini merah pada 6-18 detik, mati sebelum pytest.
      # Pagarnya ada di tests/test_kebutuhan_pip.py.
      #
      # Catatan penting bagi penyunting berikutnya: pagar
      # test_cache_pip_sudah_ada_dan_tunggal mencacah kemunculan literal
      # direktif itu di SELURUH berkas, termasuk komentar. Jangan menuliskan
      # literalnya di komentar; itu membuat cacahnya dua dan run menjadi merah.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Dipasang DARI manifes, supaya versi yang dipatok di requirements.txt
      # benar-benar versi yang berjalan. Sebelumnya paket dipasang eksplisit di
      # sini sementara manifes hanya berfungsi sebagai kunci cache, sehingga
      # angka di manifes tidak mengikat apa pun. numpy dibiarkan tak dipatok:
      # ia masuk sebagai dependensi pandas, dan mematoknya berisiko memicu
      # konflik resolver.
      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt numpy

      # Aturan 54 dan 60: cacah butir wajib terbaca walaupun pytest merah, dan
      # walaupun pengumpulan itu sendiri gagal. Karena itu `set -e` baru
      # dipulihkan SESUDAH seluruh grep selesai: grep yang tidak menemukan apa
      # pun mengembalikan 1, dan di bawah `set -e` itu akan mematikan langkah
      # ini sehingga medan BUTIR tidak pernah tertulis.
      - name: Cacah butir terkumpul
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m pytest tests --collect-only -q > /tmp/kumpul.txt 2>&1
          kode_kumpul=$?
          butir=$(grep -cE '^tests/\S+::' /tmp/kumpul.txt)
          if [ -z "$butir" ] || [ "$butir" = "0" ]; then
            butir=$(grep -oE '[0-9]+ tests? collected' /tmp/kumpul.txt | head -n1 | grep -oE '[0-9]+')
          fi
          if [ -z "$butir" ]; then butir=0; fi
          set -e
          echo "BUTIR=$butir" >> $GITHUB_ENV
          echo "KODE_KUMPUL=$kode_kumpul" >> $GITHUB_ENV
          echo "Butir terkumpul: $butir"

      # PYTHONPATH disetel eksplisit, mencerminkan lux-research. Tanpa ini impor
      # `lux_ltf` bergantung pada direktori kerja lewat `python -m pytest`, yang
      # kebetulan benar tetapi tidak dinyatakan.
      - name: Jalankan pytest
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m pytest tests -q -rf --tb=short > /tmp/pytest.txt 2>&1
          kode=$?
          set -e
          echo "KODE=$kode" >> $GITHUB_ENV

      - name: Susun laporan
        run: |
          mkdir -p reports
          set +e
          baris_gagal=$(grep -E '^(FAILED|ERROR)' /tmp/pytest.txt)
          set -e
          if [ -z "$baris_gagal" ]; then baris_gagal="(tidak ada)"; fi
          {
            echo "# Uji — lux-scalp-research"
            echo
            echo "- commit: ${{ github.sha }}"
            echo "- Butir terkumpul: ${BUTIR}"
            echo "- Kode keluar kumpul: ${KODE_KUMPUL}"
            echo "- Kode keluar pytest: ${KODE}"
            echo
            echo "## Baris FAILED/ERROR (tidak dipotong)"
            echo
            echo '```'
            echo "$baris_gagal"
            echo '```'
            echo
            echo "## Ekor keluaran (200 baris)"
            echo
            echo '```'
            tail -n 200 /tmp/pytest.txt
            echo '```'
          } > reports/tests.md

      # Laporan dikomit SEBELUM hasil ditegakkan, supaya kegagalan uji tetap
      # meninggalkan bukti di repo.
      - name: Komit laporan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/tests.md
          if git diff --cached --quiet; then
            echo "laporan tidak berubah"
            exit 0
          fi
          git commit -m "reports/tests.md [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Tegakkan hasil
        run: |
          if [ "${KODE}" != "0" ]; then
            echo "pytest gagal dengan kode ${KODE}"
            exit 1
          fi
          echo "pytest hijau"
